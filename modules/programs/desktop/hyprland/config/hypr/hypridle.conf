# hypridle -- what happens when the machine sits idle.
#
# Timeline:
#   2m30s  dim the backlight (laptop only; instantly undone by any input)
#   5m00s  lock the session
#   5m30s  turn the screen off
#  15m00s  suspend -- ON BATTERY ONLY, see below
#
# One file for both machines. hypridle has no notion of hosts and no
# conditionals, so anything machine-specific is expressed as a shell test in
# the command itself -- which is why the suspend listener checks the mains
# supply rather than the hostname.
#
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # `pidof` guard stops a second hyprlock spawning on top of the first.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine sleeps, so it never resumes unlocked -- unless
    # the nolock flag is set, since a suspend that locks anyway would defeat
    # the whole point of the switch on a laptop that suspends on battery. For
    # an always-lock-before-sleep machine, put `loginctl lock-session` back.
    before_sleep_cmd = $HOME/.local/bin/nolock lock

    # Wake the screen on resume without needing a keypress.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Dim the panel well before locking, as the warning that the lock is coming.
#
# -s saves the current level and -r restores it, so this returns to whatever
# brightness you were using rather than to a fixed number.
#
# -d intel_backlight is required, not tidiness: the laptop has a second
# /sys/class/backlight device, nvidia_0, belonging to a GPU with no display
# attached, and brightnessctl with no -d picks that one and silently does
# nothing visible. On the desktop there is no backlight device at all, so both
# commands fail harmlessly and nothing dims -- which is the correct behaviour
# there anyway.
listener {
    timeout = 150
    on-timeout = brightnessctl -d intel_backlight -s set 10%
    on-resume = brightnessctl -d intel_backlight -r
}

# `nolock lock` is `loginctl lock-session` with one guard in front of it: it
# does nothing while the waybar padlock is showing (right-click the coffee cup,
# see ~/.local/bin/nolock). Everything else on this timeline still runs, so the
# screen dims, blanks and suspends as usual -- it just comes back without
# asking for a password. The flag is on tmpfs and never survives a reboot.
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/nolock lock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend, but only when running on battery.
#
# The desktop deliberately never suspended: it runs docker and tailscale, and
# sleeping drops both. That reasoning still holds, and it is also true of this
# laptop while it is plugged in -- so rather than templating the file, the
# condition is "are we on mains", which is false on a laptop on battery and
# true on a desktop always. /sys/class/power_supply/AC/online reads 1 when the
# charger is in and 0 when it is not, so the grep succeeds only on battery. On
# a machine with no AC device the grep fails on the missing file and nothing
# suspends, which is the safe direction to fail in.
#
# condition_cmd is hypridle's own mechanism for this: it runs when the timeout
# comes up and the listener fires only if it exits 0. Verified rather than
# assumed -- a listener with `condition_cmd = false` does not run its
# on-timeout, one with `condition_cmd = true` does.
#
# To suspend on AC as well, delete the condition_cmd line. To never suspend,
# delete the listener.
#
# Lid close is NOT handled here -- that is HandleLidSwitch in
# modules/hardware/power/laptop.nix.
listener {
    timeout = 900
    condition_cmd = grep -q '^0$' /sys/class/power_supply/AC/online
    on-timeout = systemctl suspend
}
