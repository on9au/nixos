# hyprlock -- lock screen. Triggered by SUPER + Escape (via loginctl
# lock-session) or by hypridle after 5 minutes idle.
#
# This is hyprlang, not Lua -- hyprlock is a separate program from the
# compositor and keeps the classic config format.
#
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Shipped example: /run/current-system/sw/share/hypr/hyprlock.conf
#
# Clear the password buffer with ESC, Ctrl+U or Ctrl+Backspace.

$font = Fira Code Nerd Font

# Catppuccin Mocha
$base     = rgb(1e1e2e)
$surface0 = rgb(313244)
$text     = rgb(cdd6f4)
$subtext0 = rgb(a6adc8)
$overlay0 = rgb(6c7086)
$mauve    = rgb(cba6f7)
$red      = rgb(f38ba8)
$yellow   = rgb(f9e2af)

general {
    hide_cursor = true

    # Ignore Enter on an empty field instead of running a doomed auth attempt.
    ignore_empty_input = true

    # Note: there is no `grace` option in hyprlock 0.9.6 -- it is a command
    # line flag (`hyprlock --grace 5`). Without it a password is always
    # required, which is what we want here.
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred snapshot of whatever was on screen. Nothing readable survives three
# blur passes, and it avoids depending on a wallpaper file existing.
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 14

    inner_color = $base
    outer_color = $mauve
    check_color = $yellow
    fail_color  = $red
    font_color  = $text

    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false

    position = 0, -120
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $text

    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = $subtext0

    position = 0, 90
    halign = center
    valign = center
}

# Who is logged in
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = $overlay0

    position = 0, -200
    halign = center
    valign = center
}
