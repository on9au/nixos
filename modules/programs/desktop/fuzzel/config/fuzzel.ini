# Fuzzel -- application launcher (SUPER + D) and dmenu for the clipboard
# picker (SUPER + SHIFT + V).
# Man page: fuzzel.ini(5)

[main]
font=Fira Code Nerd Font:size=13
prompt="󰍉  "
icon-theme=YAMIS
terminal=kitty -e

# Sized in characters/lines, so it stays sane on both the 32" and the 27".
width=45
lines=12

horizontal-pad=24
vertical-pad=16
inner-pad=10
line-height=26

# Let the compositor scale us; fuzzel's own DPI guess fights fractional scaling.
dpi-aware=no

layer=overlay

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=b4befeff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f38ba8ff
counter=6c7086ff
border=cba6f7ff

[border]
width=2
radius=12

[dmenu]
# Used by the clipboard picker; without this an empty pipe leaves fuzzel hanging.
exit-immediately-if-empty=yes

[key-bindings]
# Ctrl+j / Ctrl+k to move the selection, matching nvim habits.
# Ctrl+k is delete-line-forward by default, so it has to be released first --
# fuzzel refuses to start if a key is bound twice.
delete-line-forward=none
next=Down Control+j
prev=Up Control+k
